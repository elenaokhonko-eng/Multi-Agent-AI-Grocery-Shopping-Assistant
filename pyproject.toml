[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-grocery-domain"
version = "0.1.0"
description = "Core domain logic for Singapore grocery assistant"
dependencies = [
    "sqlmodel>=0.0.16",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "mypy>=1.10.0",
    "ruff>=0.4.4",
]

[tool.setuptools]
package-dir = {"" = "packages"}
packages = ["domain"]

[tool.mypy]
strict = true
exclude = ["alembic"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
