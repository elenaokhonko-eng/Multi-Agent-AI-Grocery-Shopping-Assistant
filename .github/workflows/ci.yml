name: CI Pipeline

on:
  push:
    branches: [ main, refactor/*, feat/*, test/*, review/* ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scanning:
    name: Secrets & Credentials Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Global Scan for Leaked Credentials & Tokens
        run: |
          python scripts/scan_secrets.py

  backend-checks:
    name: Backend Lint, TypeCheck & PyTest
    runs-on: ubuntu-latest
    needs: [secret-scanning]
    env:
      PYTHONPATH: "packages:apps:."
      LIVE_PURCHASE_ENABLED: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-asyncio
          pip install -e .

      - name: Run Ruff Lint
        run: |
          python -m ruff check packages/ apps/ tests/

      - name: Run MyPy Type Check
        run: |
          python -m mypy packages/domain packages/retailers apps/api

      - name: Run Alembic Migration Check
        run: |
          python -m alembic -c packages/domain/alembic.ini upgrade head

      - name: Run PyTest Test Suite
        run: |
          python -m pytest -v tests/

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    needs: [secret-scanning]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "Frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Run ESLint
        working-directory: Frontend
        run: npm run lint

      - name: Run Vite Build
        working-directory: Frontend
        run: npm run build
